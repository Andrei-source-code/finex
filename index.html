<!DOCTYPE html>
<html lang="ro">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prima ta lună de adult</title>
<style>

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:32px 32px}
.app{max-width:680px;margin:0 auto;padding:0 14px 30px}

.n{color:var(--coral)!important}.p{color:var(--mint)}

button:hover,button:focus-visible{border-color:var(--blue);transform:translateY(-2px);outline:none}

button.go{background:var(--sun);border-color:#C79500;color:#2a1d00;font-weight:900;justify-content:center;text-align:center}

label{display:block;margin:12px 0 4px;font-weight:700;color:var(--mute);font-size:14px}
select{width:100%;font:inherit;padding:11px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}

details{margin-top:16px;background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
summary{cursor:pointer;font-weight:900}

.note{font-size:12px;color:var(--mute);text-align:center;padding:14px 8px}

input{width:100%;font:inherit;padding:11px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}

.tip.bad{background:rgba(255,107,129,.15);border-left-color:var(--coral)}
.flash{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:var(--coral);color:#fff;font-weight:900;padding:12px 18px;border-radius:14px;max-width:92vw;box-shadow:0 6px 0 #7a1c28}
.shake{animation:sk .5s}@keyframes sk{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
body.stress{box-shadow:inset 0 0 90px rgba(255,107,129,.4)}

@keyframes pl{to{background:rgba(255,107,129,.45)}}
@media(prefers-reduced-motion:reduce){.lowbar{animation:none}}
</style>
</head>
