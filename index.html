<html lang="ro">
<head>

<title>Prima ta lună de adult</title>
<style>

label{display:block;margin:12px 0 4px;font-weight:700;color:var(--mute);font-size:14px}
select{width:100%;font:inherit;padding:11px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}

input{width:100%;font:inherit;padding:11px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}

</style>
</head>

  return{i:'🎓',t:'Veniturile tale de student',p:`<p>Ca student nu ai un singur salariu, ci trei surse:</p><table><tr><td>Job part-time (net)</td><td>${fmt(pt)}</td></tr><tr><td>Bursă (orientativ)</td><td>${fmt(BURSA)}</td></tr><tr><td>Ajutor de la familie</td><td>${fmt(FAMILIE)}</td></tr><tr><td><b>Total lunar</b></td><td><b>${fmt(pt+BURSA+FAMILIE)}</b></td></tr></table><div class="tip">Jobul part-time are brut ${fmt(b)}, adică jumătate din salariul minim. Bursa și ajutorul pot varia, deci planifică-te după scenariul cel mai prudent.</div>`,o:[{l:'Continuă',f:next,c:'go'}]};
}
function rezerva(){
  const x=S.net;
  return{t:'Fondul de rezervă',p:'<p>Un specialist îți spune să pui bani deoparte din prima zi, pentru situațiile neprevăzute. Cât transferi din salariu?</p>',
    o:[{l:`Pun 20% (${fmt(x*.2)})`,f:()=>{toEco(x*.2);S.fl.rez=1;next();}},
       {l:`Pun 10% (${fmt(x*.1)})`,f:()=>{toEco(x*.1);S.fl.rez=1;next();}},
       {l:'Nu pun nimic, văd la sfârșit de lună',f:()=>{gafa('Nu ai pus nimic deoparte din salariu');next();}}]};
}
function mancare(){
  const set=(m)=>()=>{S.mancare=m;S.st.e=cl(S.st.e+(m<250?4:m>400?-6:0));next();};
  return{t:'Cum mănânci în luna asta?',p:'<p>Alegerea se aplică în fiecare săptămână.</p>',
    o:[{l:'Gătesc acasă (200 de lei / săptămână)',f:set(200)},
       {l:'Un pic și-un pic (300 de lei / săptămână)',f:set(300)},
       {l:'Comand des, nu am timp (450 de lei / săptămână)',f:set(450)}]};
}

/* ----- închiderea săptămânii ----- */
function closeW(n){
  add(`Mâncare, săpt. ${n}`,-S.mancare);
  add(`Facturi, săpt. ${n}`,-FACTURI_SAPT);
  let extra='';
  if(n===1){add('Abonament transport (lună)',-S.city.t);extra=`, transport ${fmt(S.city.t)}`;}
  if(n===4){add('Chiria pentru luna următoare',-S.chirie);extra=`, chirie luna viitoare ${fmt(S.chirie)}`;}
  S.st.e=cl(S.st.e-3);if(S.st.s>=60){const x=S.st.s*3;add('Cheltuieli din stres (comenzi, impulsuri)',-x);S.st.e=cl(S.st.e-6);}S.st.s=cl(S.st.s-8);S.w=Math.min(n+1,4);draw();
  return{t:`Sfârșit de săptămâna ${n}`,
    p:`<p>Mâncare ${fmt(S.mancare)}, facturi ${fmt(FACTURI_SAPT)}${extra}.</p><p>În cont: <b class="${S.bani<0?'n':''}">${fmt(S.bani)}</b></p>`,
    o:[{l:'Continuă',f:()=>{if(S.bani<0){gafa('Contul a ajuns pe minus');S.q.unshift(urgenta);}next();},c:'go'}]};
}
function urgenta(){
  const need=Math.ceil(-S.bani/100)*100+300;
  const o=[];
  if(S.eco>0){const u=Math.min(S.eco,need);o.push({l:`Folosesc fondul de rezervă (${fmt(u)})`,f:()=>{S.eco-=u;add('Bani din fondul de rezervă',u);next();}});}
  o.push({l:`Cer ajutor familiei (${fmt(need)})`,f:()=>{S.fl.fam=1;gafa('Ai rămas fără bani și ai cerut ajutor');add('Ajutor de la familie',need);next();}});
  o.push({l:`Card de credit (${fmt(need)}, dobândă 20%)`,f:()=>{gafa('Ai luat credit cu dobândă de 20%');S.fl.credit=1;S.dat+=need*1.2;add('Retragere card de credit',need);next();}});
  return{t:'Ai rămas fără bani',p:`<p>Contul e pe minus. Ai nevoie de cel puțin ${fmt(need)} ca să ajungi până la capăt. Ce faci?</p>`,o};
}

function planLuna(){
  const net=S.net,ch=S.chirie,m=S.mancare*4,fac=FACTURI_SAPT*4,tr=S.city.t,fix=ch+m+fac+tr,liber=Math.round((net-fix)/50)*50;
  const T=`<table><tr><td>${S.fac?'Venit lunar total':'Salariu net'}</td><td>${fmt(net)}</td></tr><tr><td>Chirie</td><td>−${fmt(ch)}</td></tr><tr><td>Mâncare (4 săpt.)</td><td>−${fmt(m)}</td></tr><tr><td>Facturi (4 săpt.)</td><td>−${fmt(fac)}</td></tr><tr><td>Transport</td><td>−${fmt(tr)}</td></tr>`;
  const ans=v=>()=>{const ok=v===liber,np=Math.round(fix/net*100);
    if(ok){S.st.k=cl(S.st.k+10);S.fl.bud=1;}else S.st.k=cl(S.st.k+2);draw();
    S.q.unshift(()=>({i:ok?'✅':'🧮',t:ok?'Calcul corect':'Aproape, uită-te la cifre',p:`${T}<tr><td><b>${liber<0?'Rămâi pe minus (aprox.)':'Rămâne liber (aprox.)'}</b></td><td><b>${fmt(liber)}</b></td></tr></table><div class="tip">Costurile fixe consumă ${np}% din salariul net. ${np>50?'Depășesc 50%: nu mai ai loc pentru dorințe și economii. Caută un coleg de apartament sau redu cheltuielile cu mâncarea.':'Ești în zona sănătoasă: rămâne loc pentru dorințe și economii.'}</div>`,o:[{l:'Continuă',f:next,c:'go'}]}));next();};
  return{i:'🧮',t:'Planul lunii',p:`<p>Înainte să cheltui, fă planul. Costurile fixe ale lunii:</p>${T}</table><p>Cât crezi că îți rămâne liber?</p>`,o:shuffle([liber,liber+900,liber-800]).map(v=>({l:fmt(v),f:ans(v)}))};
}
window.planUpd=()=>{const net=S.net,e=+$('#pe').value,d=+$('#pd').value,n=100-e-d,f=(i,v)=>$(i).textContent=v+'% · '+fmt(net*v/100);f('#vn',n);f('#vd',d);f('#ve',e);};
function plan(){
  const net=S.net,fix=S.chirie+S.mancare*4+FACTURI_SAPT*4+S.city.t,np=Math.round(fix/net*100);
  if(np>=95&&!S.fl.adjDone){
    const re=()=>{S.q.unshift(plan);next();},o=[];
    if(S.chirie>=S.city.r*.9)o.push({l:'Mă mut cu un coleg de apartament (chiria se înjumătățește, mutarea costă 300 de lei)',f:()=>{S.chirie=Math.round(S.city.r/2);add('Cheltuieli de mutare',-300);re();}});
    if(S.mancare>200)o.push({l:'Gătesc acasă: 200 de lei pe săptămână pentru mâncare',f:()=>{S.mancare=200;re();}});
    if(!S.fl.extra)o.push({l:'Caut o muncă în plus: +600 de lei net luna aceasta, dar ești mai obosit',f:()=>{S.fl.extra=1;S.net+=600;add('Muncă în plus (net)',600);S.st.e=cl(S.st.e-10);re();}});
    o.push({l:'Las așa și văd cum merge',f:()=>{S.fl.adjDone=1;re();}});
    return{i:'⚠️',t:'Costurile depășesc venitul',p:`<p>Nevoile tale (chirie, mâncare, facturi, transport) consumă <b>${np}%</b> din ${S.fac?'venitul lunar':'salariul net'}. Înainte să împarți banii, poți schimba ceva:</p><div class="tip">Reducerea costurilor fixe ajută mai mult decât orice buget.</div>`,o};
  }
  const row=(l,id,mx,v,vid)=>`<label for="${id}">${l}: <b id="${vid}">${v}% · ${fmt(net*v/100)}</b></label>`+(id?`<input type="range" id="${id}" min="0" max="${mx}" step="5" value="${v}" oninput="planUpd()">`:'');
  return{i:'📊',t:'Împarte-ți salariul',
    p:`<p>${S.fac?'Venitul lunar este':'Salariul net este'} <b>${fmt(net)}</b>. Înainte să-l cheltui, hotărăște cât merge pe fiecare categorie. Nevoile reale ale tale (chirie, mâncare, facturi, transport) sunt cam <b>${np}%</b>.</p>
    ${row('🛒 Nevoi (restul)','',0,60,'vn')}${row('🎉 Dorințe','pd',50,30,'vd')}${row('🛟 Economii','pe',40,10,'ve')}
    <div class="tip">Regula 50/30/20: 50% nevoi, 30% dorințe, 20% economii. Dacă nevoile tale reale depășesc 50%, ajustează.</div>`,
    o:[{l:'Confirm planul',c:'go',f:()=>{
      const e=+$('#pe').value,d=+$('#pd').value,n=100-e-d;S.plan={n,d,e};
      if(e>0){toEco(Math.round(net*e/100));S.fl.rez=1;}else gafa('Nu ai pus nimic deoparte din salariu');
      if(np<95&&n<np-2)gafa('Planul nu acoperă costurile fixe');
      if(d<10)S.st.r=cl(S.st.r-6);
      draw();
      S.q.unshift(()=>({i:'📊',t:'Rezultatul planului',p:`<p>Ai ales <b>${n}%</b> nevoi, <b>${d}%</b> dorințe, <b>${e}%</b> economii.</p><div class="tip">${np>=95?`Nevoile tale reale (${np}%) consumă aproape tot venitul, deci nicio împărțire nu le poate acoperi. Problema nu e planul, ci costurile: caută o locuință mai ieftină (coleg, cămin) sau venituri mai mari.`:n<np-2?`Nevoile tale reale sunt ${np}%, dar ai alocat doar ${n}%. Planul nu se închide și vei ajunge pe minus. Un buget realist pornește de la costurile fixe.`:`Ai acoperit nevoile reale (${np}%).`} ${e>=20?'Economiile de 20% sunt excelente.':e>0?'Economisești, dar încearcă să ajungi spre 20%.':'Fără economii, orice urgență te forțează să iei credit.'} ${d<10?'Prea puține dorințe te pot lăsa fără motivație, iar relațiile au de suferit.':''}</div>`,o:[{l:'Continuă',f:next,c:'go'}]}));
      next();}}]};
}
const luni=n=>n===1?'o lună':n+(n%100>=20||n%100===0?' de luni':' luni');
function comparatie(){
  const net=S.net,e=S.plan?S.plan.e:0,U=5000,at=(p,m)=>Math.round(net*p/100*m),mx=Math.max(1,at(20,36),at(e,36));
  const P=[[`Tu (${e}%)`,e],['Cel mai bun scenariu (20%)',20],['Cel mai prost scenariu (0%)',0]];
  const bars=P.map(([n,p])=>`<div class="fb"><span style="width:150px">${n}</span><i><u style="width:${Math.round(at(p,36)/mx*100)}%"></u></i><b style="width:90px">${fmt(at(p,36))}</b></div>`).join('');
  return `<p><b>⚖️ Cum te compari cu alte scenarii?</b> Același venit (${fmt(net)}/lună), doar obiceiurile diferă. Economii după 3 ani, fără dobândă:</p>${bars}<ul>
  <li><b>Tu:</b> după 1 an ai ${fmt(at(e,12))}. ${at(e,12)>=U?'Poți plăti o urgență de 5.000 lei din rezervă.':'O urgență de 5.000 lei te-ar duce la credit.'}</li>
  <li><b>Cel mai bun scenariu:</b> a pus deoparte 20% din fiecare salariu, din prima lună, înainte să cheltuiască. După 1 an avea ${fmt(at(20,12))}, așa că o urgență de 5.000 lei nu l-a speriat. ${e<20?`Față de tine, are cu ${fmt(at(20,36)-at(e,36))} mai mult după 3 ani, pentru că a economisit mai mult în fiecare lună.`:'Tu ai economisit cel puțin la fel de mult, deci ești pe drumul cel bun.'}</li>
  <li><b>Cel mai prost scenariu:</b> a cheltuit tot ce a câștigat și a tot amânat economisirea. Când a apărut o urgență de 5.000 lei, a luat credit cu dobândă de 20% și a ajuns să plătească ${fmt(U*1.2)}. ${e===0?'Exact asta ai făcut și tu.':'Tu ai evitat această situație.'}</li></ul>
  <div class="tip">${e>0?`La ritmul tău, strângi 5.000 lei în ${luni(Math.ceil(U/(net*e/100)))}. `:'Fără economii, nu strângi niciodată o rezervă. '}Diferența dintre cele două scenarii nu este salariul, ci cei 20% puși deoparte din prima zi.</div>`;
}

['Plătești doar rata minimă pe cardul de credit. Ce se întâmplă?',['Restul datoriei crește cu dobândă','Datoria dispare treptat, fără costuri','Nu mai plătești nimic luna următoare'],0,'Din restul neplătit se adaugă dobândă lună de lună, deci datoria durează mult și costă mai mult.'],

['Ce arată DAE (dobânda anuală efectivă) la un credit?',['O reducere oferită de bancă','Costul total al creditului, exprimat anual','Dobânda pe o singură lună'],1,'DAE include dobânda și comisioanele, deci arată costul real. Compară DAE, nu doar dobânda.'],

function quiz(i){const q=QZ[i];
  return{i:'🧠',t:'Test rapid',p:`<p>${q[0]}</p>`,o:q[1].map((l,j)=>({l,f:()=>{const ok=j===q[2];if(ok){S.qz++;S.st.k=cl(S.st.k+8);draw();}
    S.q.unshift(()=>({i:ok?'✅':'❌',t:ok?'Corect!':'Nu chiar',p:`<div class="tip">${q[3]}</div>`,o:[{l:'Continuă',f:next,c:'go'}]}));next();}}))};

function tentatie(){
  return{tm:Math.round((S.st.s>=60?10:15)*[1.5,1,.6][S.dif]),t:'Un clip pe TikTok',
    p:'<p>Un influencer spune că face „3.000 € pe lună din dropshipping, fără efort”. Cursul lui și primul stoc costă <b>500 lei</b>.</p>',
    o:[{l:'Investesc 500 lei, merită riscul',f:()=>{gafa('Ai investit 500 lei într-o promisiune neverificată');S.fl.inv=1;add('Curs și stoc dropshipping',-500);next();}},
       {l:'Mai întâi verific costurile reale',f:()=>{S.fl.ver=1;S.q.unshift(analiza);next();}},
       {l:'Ignor clipul',f:()=>{S.fl.ver=1;S.fl.hunt=3;next();}}]};
}
function analiza(){
  const F=(t,g)=>`<span class="fl" ${g?'data-g="1"':''} onclick="this.classList.toggle('on')">${t}</span>`;
  return{i:'🔍',t:'Vânătoare de capcane',
    p:`<p>Atinge frazele care ți se par suspecte, apoi apasă Verifică. Atenție: nu toate sunt capcane.</p>
    <div class="ad">🔥 Câștigă 3.000 € lunar din telefon! ${F('Fără experiență',1)}, ${F('fără investiție mare',1)}, ${F('cursuri video incluse')}. ${F('Doar 5 locuri rămase azi!',1)} Rezultate ${F('garantate 100%',1)}, vezi ${F('poze cu mașini de lux',1)} și ${F('suport 24/7')}.</div>`,
    o:[{l:'Verifică',c:'go',f:()=>{
      const ok=document.querySelectorAll('.fl.on[data-g]').length,bad=document.querySelectorAll('.fl.on:not([data-g])').length;
      const sc=ok-bad;S.fl.hunt=sc;S.st.k=cl(S.st.k+sc*3);
      S.q.unshift(()=>({i:'🧠',t:'Rezultat vânătoare',p:`<p>Ai găsit <b>${ok} din 5</b> capcane${bad?` și ai marcat ${bad} fraze corecte`:''}.</p><div class="tip">Costuri ascunse: reclame ~300 lei, retururi ~120 de lei, comision ~60 de lei, impozit 10% din profit. Majoritatea celor care încep nu își recuperează investiția în prima lună.</div>`,
        o:[{l:'Renunț la ideea asta',f:next},{l:'Tot investesc 500 lei, dar știu riscul',f:()=>{S.fl.inv=1;add('Curs și stoc dropshipping',-500);next();}}]}));
      next();}}]};
}

function prieten(){
  return{t:'Un prieten îți cere bani',p:'<p>Un prieten are nevoie de 500 lei „până la salariu”. Nu e sigur când ți-i dă înapoi.</p>',
    o:[{l:'Îi dau 500 lei',f:()=>{S.fl.imp=1;add('Împrumut dat unui prieten',-500);next();}},
       {l:'Îi dau 200 lei, cât îmi permit',f:()=>{add('Ajutor dat unui prieten',-200);next();}},
       {l:'Refuz politicos',f:next}]};
}
function decizie(){
  const o=[];
  if(S.dat>0&&S.bani>0)o.push({l:'Plătesc datoriile cât pot',f:()=>{const p=Math.min(S.bani,S.dat);S.dat-=p;add('Plată datorii',-p);next();}});
  if(S.bani>0)o.push({l:'Pun jumătate din bani în fondul de rezervă',f:()=>{toEco(Math.round(S.bani/2));next();}});
  o.push({l:'Mă răsplătesc cu o ieșire și haine noi',f:()=>{if(S.bani>0)add('Ieșiri și haine',-Math.round(S.bani/2));next();}});
  return{t:'Ultima decizie',p:`<p>Luna s-a încheiat. În cont ai <b>${fmt(S.bani)}</b>${S.dat>0?` și datorii de ${fmt(S.dat)}`:''}. Ce faci cu banii?</p>`,o};
}

function cheltuieli(){
  const C={'🏠 Chirie și garanție':0,'🍜 Mâncare':0,'💡 Facturi și transport':0,'🎉 Ieșiri, cumpărături, impulsuri':0,'⚠ Pierderi (fraude, rate, taxe)':0};
  S.log.filter(l=>l.a<0&&!/Transfer în fond|din fond/.test(l.d)).forEach(l=>{const x=-l.a,d=l.d;
    const k=/chiri|Garanț|cămin/i.test(d)?0:/Mâncare/.test(d)?1:/Facturi|transport|curent/i.test(d)?2:/dropshipping|Avans|Impozit|Retragere|datorii|stres|Împrumut|Contract|prieten/i.test(d)?4:3;C[Object.keys(C)[k]]+=x;});
  const t=Object.values(C).reduce((a,b)=>a+b,0)||1;
  return `<p><b>Unde au plecat banii</b> (${fmt(t)} în total)</p>`+Object.entries(C).map(([n,v])=>`<div class="fb"><span style="width:190px">${n}</span><i><u style="width:${Math.round(v/t*100)}%"></u></i><b style="width:70px">${Math.round(v/t*100)}%</b></div>`).join('')+`<div class="tip">Regula 50/30/20: aproximativ 50% pentru nevoi (chirie, mâncare, facturi), 30% pentru dorințe și 20% pentru economii. Tu cum ai stat?</div>`;
}
function actiuni(){
  const f=S.fl,m=re=>S.mis.some(x=>re.test(x.m)),A=[];
  if(!f.rez||(S.plan&&S.plan.e<10))A.push('Deschide un cont separat pentru economii și setează un transfer automat de 10–20% în ziua salariului.');
  if(S.dat>0||f.credit)A.push('Notează toate datoriile cu dobânda lor și plătește-o întâi pe cea mai scumpă. Evită ratele și cardul de credit până ai o rezervă.');
  if(m(/bancă/))A.push('Nu da niciodată datele cardului printr-un link. Sună banca la numărul de pe card.');
  if(m(/împrumut/i))A.push('Înainte de orice credit, compară DAE la cel puțin două bănci. Evită împrumuturile „rapide”, fără acte.');
  if(f.inv||m(/dropshipping|promisiun/i))A.push('Înainte să investești în orice „oportunitate”, caută păreri independente și calculează costurile totale.');
  if(m(/abonament|30 de zile/i))A.push('Verifică-ți abonamentele în prima zi a fiecărei luni și anulează-le pe cele pe care nu le folosești.');
  if(m(/contract/i))A.push('Cere întotdeauna contract de închiriere scris și înregistrat, cu garanția menționată.');
  if(S.bani<0)A.push('Fă un buget săptămânal și verifică-l în fiecare duminică.');
  A.push('Notează-ți toate cheltuielile timp de o lună, ca să vezi unde se duc banii.','Folosește regula 50/30/20 ca punct de plecare pentru bugetul tău.','Strânge treptat o rezervă de 3–6 luni de cheltuieli.');
  return `<p><b>✅ Planul tău de acțiune</b></p><ol>${A.slice(0,3).map(x=>`<li>${x}</li>`).join('')}</ol>`;
}
/* ----- scorul final ----- */
function final(){
  const f=S.fl;let p=0;const ok=[],ko=[];
  const r=(c,pts,y,n)=>{if(c){p+=pts;ok.push(y);}else ko.push(n);};
  r(S.bani>=0,15,'Ai încheiat luna fără să fii pe minus.','Contul a ajuns pe minus. Fă un buget pe săptămână.');
  r(S.dat===0,20,'Nu ai rămas cu datorii.','Ai rămas cu datorii. Plătește-le primele.');
  r(S.eco>=1500,25,'Ai un fond de rezervă solid.','Fondul de rezervă e mic. Țintește cel puțin o chirie și jumătate.');
  r((f.hunt||0)>=3,15,'Ai depistat capcanele dintr-o reclamă de „bani rapizi”.','Capcanele dintr-o reclamă falsă te pot păcăli. Verifică costurile și taxele.');
  r(!f.fam&&!f.credit,15,'Nu ai avut nevoie de credit sau de ajutor.','Ai apelat la credit sau la familie. Un fond de rezervă te scutește.');
  r(!!f.rez,10,'Ai pus bani deoparte din prima zi.','Nu ai pus nimic deoparte din salariu.');
  p=cl(p);const t=S.st,tot=cl((p*2+t.e+t.r+t.k)/5-S.mis.length*3);
  const rk=tot>=85?'Legendă':tot>=70?'Adult pe bune':tot>=50?'Ucenic al vieții':'Începător',s=Math.round(tot/20);
  const bar=(l,v)=>`<div class="fb"><span>${l}</span><i><u style="width:${v}%"></u></i><b>${v}</b></div>`;
  const prev=ld('last'),rec={tot,mis:S.mis.length,e:S.plan?S.plan.e:0,qz:S.qz},best=Math.max(tot,ld('best')||0);sv('best',best);sv('last',rec);
  const dl=prev?`<div class="tip"><b>🔁 Față de data trecută:</b> scor ${prev.tot} → ${tot} (${tot>=prev.tot?'+':''}${tot-prev.tot}), greșeli ${prev.mis} → ${S.mis.length}, economii ${prev.e}% → ${rec.e}%, test ${prev.qz} → ${S.qz}.</div>`:'';
  return{i:'🏆',t:'Scorul tău de viață',
    p:`<p class="score ${tot>=50?'p':'n'}">${tot}/100</p><p class="stars">${'★'.repeat(s)}${'☆'.repeat(5-s)}</p><p class="rank">${rk}</p>
    <p>${S.job.e} ${S.job.n}, ${S.city.n}</p>${bar('💰 Finanțe',p)}${bar('⚡ Energie',t.e)}${bar('❤️ Relații',t.r)}${bar('🧠 Dezvoltare',t.k)}
    <div class="tip bad"><b>⚠ ${S.mis.length} greșeli</b><ul>${S.mis.map(x=>`<li>Săpt. ${x.w}: ${x.m}</li>`).join('')||'<li>Nicio greșeală majoră. Bravo!</li>'}</ul></div><p><b>Ce ai făcut bine</b></p><ul>${ok.map(x=>`<li>${x}</li>`).join('')||'<li>Încă nimic. Încearcă din nou.</li>'}</ul>
    <p><b>Ce poți îmbunătăți</b></p><ul>${ko.map(x=>`<li>${x}</li>`).join('')||'<li>Nimic major.</li>'}</ul>
    <p>🏅 Cel mai bun scor: <b>${best}/100</b> · dificultate: ${['ușor','normal','greu'][S.dif]}</p>${dl}<p><b>🧠 Cunoștințe:</b> ${S.qz}/${QZ.length} la test · ${f.bud?'ai estimat corect bugetul':'ai estimat greșit bugetul'}</p><p><b>💡 Lecțiile lunii</b></p><ul>${S.les.map(x=>`<li>${x}</li>`).join('')||'<li>Nicio lecție încă.</li>'}</ul>${comparatie()}${cheltuieli()}${actiuni()}<div class="tip">Banii din joc erau fictivi, iar cifrele sunt orientative (vezi „Despre date și surse” pe ecranul de început). Cum ai fi decis cu banii tăi? Încearcă altă meserie.</div>`,
    o:[{l:'Joacă din nou',f:start,c:'go'},{l:'Copiază scorul',f:()=>{const m=`Am obținut ${tot}/100 (${rk}) ca ${S.job.n} în ${S.city.n} în „Prima ta lună de adult”!`;try{navigator.clipboard.writeText(m);}catch(e){}const t=document.createElement('div');t.className='toast p';t.textContent='Scor copiat';document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}}]};
}

(document.querySelector('details')||$('#stage')).insertAdjacentHTML('afterend','<details><summary>📖 Dicționar financiar</summary><ul><li><b>Brut / Net</b>: brutul e din contract, netul e ce intră în cont după taxe.</li><li><b>CAS / CASS</b>: contribuții la pensie (25%) și la sănătate (10%).</li><li><b>Garanție</b>: suma lăsată proprietarului, returnată la final dacă nu sunt stricăciuni.</li><li><b>Fond de rezervă</b>: bani puși deoparte pentru urgențe, ideal 3–6 luni de cheltuieli.</li><li><b>Dobândă / DAE</b>: costul total al unui credit, exprimat anual.</li><li><b>Inflație</b>: creșterea prețurilor în timp.</li><li><b>Phishing</b>: mesaj fals prin care ești păcălit să dai date sau bani.</li><li><b>Regula 50/30/20</b>: 50% nevoi, 30% dorințe, 20% economii.</li></ul></details>');
start();
</script>
